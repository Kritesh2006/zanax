<!doctype html>
<html lang="en">
<head>

<title>After Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2a55;--pink:#ff3fa4;--cyan:#3ff0ff;--gold:#ffcf7a;--cream:#fbeef2;--muted:#c9a9b6;--line:rgba(255,63,164,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#07010a;color:var(--cream);font-family:'Inter',system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#scan{position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.55}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65))}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:30;opacity:1;transition:opacity 1.2s}
.neon{font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:4px;color:#fff;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 40px var(--red)}
.serif{font-family:'Cormorant Garamond',serif;font-style:italic}

#hud{position:fixed;left:0;right:0;top:0;z-index:6;display:none;flex-direction:column;align-items:center;gap:7px;padding:calc(env(safe-area-inset-top) + 12px) 12px 0;pointer-events:none}
#hud.on{display:flex}
.mlabel{font-family:'Orbitron';font-size:10px;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
.slots{display:flex;gap:6px}
.slot{width:34px;height:40px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid rgba(255,255,255,.18);font-family:'Orbitron';font-weight:900;font-size:21px;color:rgba(255,255,255,.25)}
.slot.on{color:#fff;border-color:var(--pink);text-shadow:0 0 8px var(--pink),0 0 20px var(--red);animation:pop .45s}
.slot.cur{border-color:var(--cyan);box-shadow:0 6px 12px -8px var(--cyan)}
#stat{font-family:'Orbitron';font-size:12px;letter-spacing:3px;color:var(--cream);min-height:16px;text-shadow:0 0 8px var(--pink)}
#mute{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:12;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(10,2,12,.5);color:var(--cream);font-size:15px;display:none;align-items:center;justify-content:center;cursor:pointer}
#mute.on{display:flex}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;z-index:6;pointer-events:none;font-family:'Orbitron';font-size:11px;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 10px var(--cyan);text-transform:uppercase;transition:opacity .5s;padding:0 20px}
#toast{position:fixed;left:0;right:0;top:25%;text-align:center;z-index:7;pointer-events:none;opacity:0;font-family:'Orbitron';font-weight:900;font-size:28px;letter-spacing:6px;text-transform:uppercase;color:#fff;text-shadow:0 0 8px var(--pink),0 0 24px var(--pink),0 0 50px var(--red)}
#toast.go{animation:toast 1.15s ease-out forwards}
#toast.cy{text-shadow:0 0 8px var(--cyan),0 0 24px var(--cyan)}
@keyframes toast{0%{opacity:0;transform:scale(1.5);filter:blur(6px)}14%{opacity:1;transform:scale(1);filter:blur(0)}72%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(255,30,70,.6))}
#flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px)}
.ov.on{display:flex}
.ov.dim{background:rgba(4,0,6,.55)}
.panel{width:100%;max-width:370px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;animation:rise .7s cubic-bezier(.2,1,.3,1)}
.panel.box{background:rgba(12,2,14,.72);border:1px solid var(--line);padding:30px 22px 24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 40px rgba(255,42,85,.18),inset 0 0 30px rgba(255,63,164,.06)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.k{font-family:'Orbitron';font-size:10px;letter-spacing:5px;color:var(--cyan);text-shadow:0 0 8px var(--cyan);text-transform:uppercase}
h1{margin:0;font-family:'Orbitron';font-weight:900;font-size:30px;letter-spacing:5px;text-transform:uppercase;color:#fff;text-shadow:0 0 8px var(--pink),0 0 22px var(--pink),0 0 48px var(--red);animation:flick 5s infinite}
@keyframes flick{0%,19%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
.line{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;line-height:1.3;color:var(--cream);margin:0}
.small{font-size:14px;line-height:1.55;color:var(--muted);margin:0}
.btn{font-family:'Orbitron';font-weight:700;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#fff;background:transparent;border:1.5px solid var(--pink);padding:14px 34px;cursor:pointer;box-shadow:0 0 14px rgba(255,63,164,.55),inset 0 0 14px rgba(255,63,164,.35);text-shadow:0 0 8px var(--pink)}
.btn:active{transform:scale(.96);background:rgba(255,63,164,.15)}
.btn.sm{font-size:10px;padding:10px 22px;border-color:rgba(255,255,255,.3);box-shadow:none;text-shadow:none;color:var(--muted)}
input#nm{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--pink);color:#fff;font-family:'Orbitron';font-size:22px;letter-spacing:4px;text-align:center;text-transform:uppercase;padding:10px 4px;outline:none;box-shadow:0 10px 16px -14px var(--pink);-webkit-user-select:text;user-select:text;touch-action:auto}
input#nm::placeholder{color:rgba(255,255,255,.22)}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#story{position:fixed;left:0;right:0;top:38%;z-index:8;text-align:center;pointer-events:none;padding:0 26px}
#story div{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;line-height:1.25;color:#fff;opacity:0;transition:opacity 1s;text-shadow:0 0 18px rgba(255,63,164,.6)}
#story div.on{opacity:1}
.bigl{font-family:'Orbitron';font-weight:900;font-size:110px;line-height:1;color:#fff;text-shadow:0 0 10px var(--pink),0 0 34px var(--pink),0 0 80px var(--red);animation:pop .6s}
.vs{font-family:'Orbitron';font-weight:900;font-size:21px;letter-spacing:3px;color:#fff;text-shadow:0 0 10px var(--pink);line-height:1.5;word-break:break-word}
.vs i{font-style:normal;color:var(--cyan);text-shadow:0 0 10px var(--cyan);display:block;font-size:16px}
.meter{width:100%;height:6px;border:1px solid var(--line);position:relative;overflow:hidden}
.meter b{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--red),var(--pink),var(--cyan));box-shadow:0 0 14px var(--pink)}
.pct{font-family:'Orbitron';font-weight:900;font-size:64px;color:#fff;text-shadow:0 0 10px var(--pink),0 0 30px var(--pink),0 0 60px var(--red);min-height:76px;line-height:76px}
.facts{width:100%;text-align:left;margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 2px;font-size:13px;color:var(--muted);opacity:0;transform:translateY(6px);transition:all .5s}
.facts li.on{opacity:1;transform:none}
.facts li b{font-family:'Orbitron';font-weight:700;font-size:11px;letter-spacing:2px;color:#fff;text-transform:uppercase;text-shadow:0 0 8px var(--pink);text-align:right}
.sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:34px;color:var(--gold);text-shadow:0 0 14px rgba(255,207,122,.5)}
#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#07010a;font-family:'Orbitron';font-size:11px;letter-spacing:6px;color:var(--pink);text-shadow:0 0 10px var(--pink)}
</style>
</head>

<div id="story"></div>
<div class="ov" id="ov"><div class="panel" id="panel"></div></div>

<div id="loading">LOADING</div>

<script type="importmap">

</script>
<script type="module">
import * as THREE from 'three';
import {FontLoader} from 'three/addons/loaders/FontLoader.js';

const NAME='KRITESH';
const QA=new URLSearchParams(location.search).has('qa');
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let player='YOU';

/* ================= RENDERER ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:false,powerPreference:'high-performance'});
const DPR=Math.min(devicePixelRatio,1.6);renderer.setPixelRatio(DPR);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x14020c,30,190);
const camera=new THREE.PerspectiveCamera(60,1,.1,600);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.75,.45,.6);composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);bloom.resolution.set(w*DPR*.5,h*DPR*.5);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const fitZ=(halfW,lo=6,hi=30)=>clamp(halfW/(Math.tan(THREE.MathUtils.degToRad(30))*camera.aspect),lo,hi);

const pm=new THREE.PMREMGenerator(renderer);const envTex=pm.fromScene(new RoomEnvironment(),.04).texture;
const chrome=(c=0xffd0e6)=>new THREE.MeshStandardMaterial({color:c,metalness:1,roughness:.18,envMap:envTex,envMapIntensity:1.6,emissive:0xff2a77,emissiveIntensity:.18});
const glow=(c,i=2)=>new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i)});
const dark=(c=0x0d0410)=>new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.4});
scene.add(new THREE.HemisphereLight(0xff7fb0,0x12020a,.6));
const key=new THREE.DirectionalLight(0xffc0d8,1.1);key.position.set(3,8,6);scene.add(key);

/* ---------- sky ---------- */
{const cv=document.createElement('canvas');cv.width=4;cv.height=512;const x=cv.getContext('2d');const g=x.createLinearGradient(0,0,0,512);
 g.addColorStop(0,'#030006');g.addColorStop(.4,'#0e0214');g.addColorStop(.56,'#2c0619');g.addColorStop(.65,'#5e0c2a');g.addColorStop(.69,'#1a020c');g.addColorStop(1,'#060005');
 x.fillStyle=g;x.fillRect(0,0,4,512);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;
 const sky=new THREE.Mesh(new THREE.SphereGeometry(400,32,24),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false,depthWrite:false}));scene.add(sky)}
const starsG=new THREE.BufferGeometry();{const a=[];for(let k=0;k<900;k++){const v=new THREE.Vector3().randomDirection();if(v.y<.08)v.y=Math.abs(v.y)+.08;v.multiplyScalar(380);a.push(v.x,v.y,v.z)}starsG.setAttribute('position',new THREE.Float32BufferAttribute(a,3))}
scene.add(new THREE.Points(starsG,new THREE.PointsMaterial({color:0xffdcef,size:1.1,sizeAttenuation:true,fog:false,transparent:true,opacity:.75})));

/* ---------- retro sun ---------- */
const sunMat=new THREE.ShaderMaterial({transparent:true,fog:false,depthWrite:false,uniforms:{t:{value:0}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`varying vec2 vUv;uniform float t;void main(){vec2 p=vUv-.5;float r=length(p);if(r>.5)discard;
  float y=vUv.y;vec3 c=mix(vec3(.85,.04,.28),vec3(.95,.42,.16),smoothstep(.1,.95,y));
  if(y<.6){float band=fract(y*13.-t*.35);if(band<(.6-y)*1.6)discard;}
  float a=smoothstep(.5,.47,r);gl_FragColor=vec4(c,a);}`});
const sun=new THREE.Mesh(new THREE.CircleGeometry(40,64),sunMat);sun.position.set(0,18,-340);scene.add(sun);

/* ---------- skyline ---------- */
function windowTex(){const cv=document.createElement('canvas');cv.width=64;cv.height=128;const x=cv.getContext('2d');x.fillStyle='#07020a';x.fillRect(0,0,64,128);
 for(let i=0;i<8;i++)for(let j=0;j<20;j++){if(Math.random()<.32){x.fillStyle=pick(['#ff3f8a','#ffb36b','#3ff0ff','#ff5a5a','#ffd9a8']);x.globalAlpha=rr(.35,1);x.fillRect(4+i*7.5,4+j*6.1,4,3.2)}}
 x.globalAlpha=1;const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;return t}
const winTexs=[windowTex(),windowTex(),windowTex()];
const skyline=new THREE.Group();scene.add(skyline);
for(let k=0;k<70;k++){const w=rr(6,16),h=rr(14,70),d=rr(6,14);
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({map:winTexs[k%3],color:0xcfc0d0}));
 const side=k%2?1:-1;m.position.set(side*rr(14,150),h/2,rr(-260,-120));skyline.add(m)}

/* ---------- neon grid ---------- */
const gridMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{off:{value:0},col:{value:new THREE.Color(1.0,.1,.55)},road:{value:1},gain:{value:1}},
 vertexShader:'varying vec3 wp;void main(){vec4 w=modelMatrix*vec4(position,1.);wp=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
 fragmentShader:`varying vec3 wp;uniform float off;uniform vec3 col;uniform float road;uniform float gain;
 float ln(float v,float w){float d=abs(fract(v)-.5);float f=fwidth(v);return 1.-smoothstep(w-f,w+f,.5-d);}
 void main(){float gx=ln(wp.x/1.7+.5,.022);float gz=ln((wp.z-off)/3.,.02);float g=max(gx,gz);
  float dist=length(wp.xz);float fade=1.-smoothstep(40.,170.,dist);
  float isRoad=road*step(abs(wp.x),2.55);vec3 base=vec3(.03,.0,.04)+isRoad*vec3(.06,.0,.05);
  vec3 c=base+col*g*gain*(isRoad>.5?.9:.4);gl_FragColor=vec4(c*fade,1.);}`});
const grid=new THREE.Mesh(new THREE.PlaneGeometry(500,500),gridMat);grid.rotation.x=-Math.PI/2;scene.add(grid);

/* ---------- rain ---------- */
const RAIN=500,rainG=new THREE.BufferGeometry(),rainP=new Float32Array(RAIN*6);
for(let i=0;i<RAIN;i++){const x=rr(-25,25),y=rr(0,30),z=rr(-40,15);rainP.set([x,y,z,x+.05,y+.9,z],i*6)}
rainG.setAttribute('position',new THREE.BufferAttribute(rainP,3));
const rain=new THREE.LineSegments(rainG,new THREE.LineBasicMaterial({color:0x9fdcff,transparent:true,opacity:.16}));scene.add(rain);

/* ---------- text ---------- */
let font=null;const geoCache={};
function letter(ch,size=1,material=chrome()){
 if(font){const k=ch+size;if(!geoCache[k]){const g=new TextGeometry(ch,{font,size,height:size*.3,depth:size*.3,curveSegments:6,bevelEnabled:true,bevelThickness:size*.05,bevelSize:size*.035,bevelSegments:3});g.center();geoCache[k]=g}
  return new THREE.Mesh(geoCache[k],material)}
 const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');x.fillStyle='#ffd0e6';x.font='900 200px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,128,140);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));s.scale.setScalar(size*1.6);return s}
function neonEdges(geo,color,i=2.2){return new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:new THREE.Color(color).multiplyScalar(i)}))}
function neonBox(w,h,d,color,fill=0x0b0310){const g=new THREE.Group();const geo=new THREE.BoxGeometry(w,h,d);g.add(new THREE.Mesh(geo,dark(fill)));g.add(neonEdges(geo,color));return g}

/* ---------- particles ---------- */
const parts=[],pGeo=new THREE.SphereGeometry(.06,6,6);
function burst(pos,color=0xff3fa4,n=22,spd=6){for(let k=0;k<n;k++){const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:new THREE.Color(k%3?color:0xffffff).multiplyScalar(2),transparent:true}));
 m.position.copy(pos);m.userData={v:new THREE.Vector3().randomDirection().multiplyScalar(rr(1.5,spd)),life:1};scene.add(m);parts.push(m)}}

/* ================= AUDIO ================= */
let ac=null,master=null,sfxGain=null,muted=false;
const tracks={tomorrow:new Audio('tomorrow.mp3'),tsunami:new Audio('tsunami.mp3')};
for(const a of Object.values(tracks)){a.loop=true;a.preload='auto';a.volume=0;a.playsInline=true;a.setAttribute('playsinline','')}
let curTrack=null;
function fadeVol(a,to,ms){const from=a.volume,t0=performance.now();return new Promise(res=>{(function st(){const k=Math.min(1,(performance.now()-t0)/ms);a.volume=clamp(from+(to-from)*k,0,1);k<1?requestAnimationFrame(st):res()})()})}
async function music(name,vol=.75){if(curTrack===name)return;const prev=curTrack;curTrack=name;
 if(prev){const p=tracks[prev];fadeVol(p,0,1500).then(()=>p.pause())}
 const a=tracks[name];try{a.currentTime=0;await a.play();fadeVol(a,muted?0:vol,2000)}catch(e){}}
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();sfxGain=ac.createGain();sfxGain.gain.value=.5;sfxGain.connect(ac.destination)}catch(e){}
 // unlock both tracks on first gesture (iOS)
 for(const a of Object.values(tracks)){const p=a.play();if(p)p.then(()=>{if(curTrack!==Object.keys(tracks).find(k=>tracks[k]===a))a.pause()}).catch(()=>{})}}
function tone(f1,f2,d,w='sine',v=.14,dl=0){if(!ac||muted)return;const t=ac.currentTime+dl;const o=ac.createOscillator(),g=ac.createGain();o.type=w;
 o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(sfxGain);o.start(t);o.stop(t+d+.02)}
const sfx={good:()=>[880,1320].forEach((f,i)=>tone(f,f,.14,'triangle',.1,i*.06)),bad:()=>tone(260,90,.3,'square',.06),
 hit:()=>tone(140,45,.35,'sawtooth',.08),tick:()=>tone(1200,900,.04,'sine',.05),whoosh:()=>tone(1500,180,.25,'sawtooth',.03),
 win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,f*1.005,.25,'triangle',.11,i*.08)),pad:f=>tone(f,f,.32,'triangle',.14)};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'×':'♪';if(curTrack)fadeVol(tracks[curTrack],muted?0:.75,300)};

/* ================= UI ================= */
const slotsEl=$('slots');for(let k=0;k<7;k++){const d=document.createElement('div');d.className='slot';slotsEl.appendChild(d)}
let got=0;
function setSlots(){[...slotsEl.children].forEach((d,k)=>{d.className='slot'+(k<got?' on':'')+(k===got?' cur':'');d.textContent=k<got?NAME[k]:''})}
function toast(t,cy){const e=$('toast');e.textContent=t;e.classList.toggle('cy',!!cy);e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
function hint(t){$('hint').textContent=t||'';$('hint').style.opacity=t?1:0}
function stat(t){$('stat').textContent=t||''}

   else{this.miss++;stat(`mistakes ${this.miss} / 8`);setTimeout(()=>{a.up=b.up=false;sfx.bad();if(this.miss>=8){toast('Reshuffle');setTimeout(()=>{for(const k of this.cards)stage.remove(k.g);this.make()},600)}else this.busy=false},750)}}},
 update(dt,t){for(const c of this.cards){const target=c.up||c.done?0:Math.PI;c.rot+=(target-c.rot)*Math.min(1,dt*12);c.g.rotation.y=c.rot;if(c.done)c.g.position.z=Math.sin(t*3+c.id)*.05}
  if(QA&&!this.busy&&!this.qa){this.qa=1;(async()=>{for(let id=0;id<6;id++){const p=this.cards.filter(c=>c.id===id);this.flip(p[0]);this.flip(p[1]);await sleep(500)}})()}}});

/* 7. H : The Last One (it cannot be caught) */
M.push({L:'H',title:'The Last One',how:'Three touches in twenty seconds and my name is complete.',hint:'catch it',
 setup(){this.car=makeCar();this.car.position.z=2;stage.add(this.car);roadSpeed=22;driveGrid();
  this.H=letter('H',1.25);this.H.position.set(0,3,-6);stage.add(this.H);this.hp=3;this.time=20;this.dodges=0;this.decoys=[];this.sp=1.2;this.over=false;this.ui();
  camTo(new THREE.Vector3(0,3,fitZ(3.2,7,13)+2),new THREE.Vector3(0,2.6,-6))},
 ui(){stat('H '+'◆'.repeat(this.hp)+'◇'.repeat(3-this.hp)+'   '+Math.max(0,this.time).toFixed(1))},
 rp(){return new THREE.Vector3(rr(-2.3,2.3),rr(1.6,5.4),rr(-8,-4))},
 tele(o){let p,n=0;do{p=this.rp();n++}while(p.distanceTo(o.position)<3&&n<20);sfx.whoosh();burst(o.position.clone(),0xff3fa4,10,4);o.position.copy(p);o.userData.tg=this.rp()},
 tap(e){if(this.over)return;const all=[this.H,...this.decoys];let best=null,bd=95;for(const o of all){const d=screenDist(o,e);if(d<bd){bd=d;best=o}}
  if(!best){toast('Missed');return}
  if(best!==this.H){sfx.bad();burst(best.position.clone(),0x888888,10);stage.remove(best);this.decoys.splice(this.decoys.indexOf(best),1);toast('Not me');return}
  if(this.hp>1){this.hp--;this.ui();sfx.hit();buzz(70);shake=.35;burst(this.H.position.clone(),0xff2a55,28);toast(this.hp===2?'Two more':'One more');this.sp+=.9;this.tele(this.H);return}
  this.dodges++;this.tele(this.H);toast(['Not yet','Too slow','Almost','Nope','Closer','Patience'][(this.dodges-1)%6],true);this.sp=Math.min(this.sp+.3,4.5);
  if(this.dodges===3||this.dodges===7)for(let k=0;k<3;k++){const d=letter('H',1.25);d.position.copy(this.H.position);d.userData.tg=this.rp();stage.add(d);this.decoys.push(d)}},
 update(dt,t){if(this.over)return;this.time-=dt;this.ui();
  if(QA&&Math.random()<dt*3)this.tap((()=>{const v=this.H.getWorldPosition(new THREE.Vector3()).project(camera);return{clientX:(v.x+1)/2*innerWidth,clientY:(1-v.y)/2*innerHeight}})());
  for(const o of [this.H,...this.decoys]){if(!o.userData.tg||o.position.distanceTo(o.userData.tg)<.3)o.userData.tg=this.rp();o.position.lerp(o.userData.tg,Math.min(1,dt*this.sp));o.rotation.y=Math.sin(t*2+o.id)*.6}
  this.car.position.x=Math.sin(t*.7)*.8;
  if(this.time<=0){this.over=true;playing=false;finale()}}});

/* ================= FLOW ================= */
let mi=0;
async function startMission(){cur=null;playing=false;clearStage();rig.free=false;const m=M[mi];
 panel(`<div class="k">mission ${String(mi+1).padStart(2,'0')} / 07</div><h1>${m.title}</h1><p class="small">${m.how}</p><button class="btn" id="go">${mi===6?'Final':'Start'}</button>`);
 $('mlabel').textContent=`mission ${String(mi+1).padStart(2,'0')}  ·  ${m.title}`;stat('');hint('');
 if(QA)setTimeout(()=>$('go').click(),300);
 await waitClick('go');hidePanel();m.setup();cur=m;playing=true;hint(m.hint);setTimeout(()=>{if(cur===m)hint('')},5000)}
async function complete(){if(!playing)return;playing=false;const m=cur;cur=null;hint('');stat('');sfx.win();buzz(40);
 const L=m.L;const big=letter(L,2.2);const cp=camera.position.clone(),dir=new THREE.Vector3();camera.getWorldDirection(dir);
 big.position.copy(cp).addScaledVector(dir,7);big.lookAt(cp);scene.add(big);burst(big.position.clone(),0xff3fa4,40,8);
 const t0=performance.now();await new Promise(r=>{(function a(){const k=Math.min(1,(performance.now()-t0)/1200);big.scale.setScalar(Math.max(.01,ease(k)));big.rotateY(.12*(1-k));k<1?requestAnimationFrame(a):r()})()});
 got=mi+1;setSlots();await sleep(500);
 panel(`<div class="k">${got} / 7 found</div><div class="bigl">${L}</div><button class="btn" id="nx">${got===6?'One left':'Next'}</button>`,false,true);
 if(QA)setTimeout(()=>$('nx').click(),300);
 await waitClick('nx');scene.remove(big);hidePanel();mi++;startMission()}

async function intro(){
 panel(`<div class="k">after dark</div><p class="line">Before we start.</p><input id="nm" maxlength="14" placeholder="your name" autocomplete="off" autocapitalize="words" spellcheck="false"><button class="btn" id="enter">Enter</button>`);
 const go=()=>{const v=$('nm').value.trim();if(!v){$('nm').classList.remove('shake');void $('nm').offsetWidth;$('nm').classList.add('shake');return}
  player=v.replace(/[<>&"]/g,'').slice(0,14);initAudio();music('tomorrow');hidePanel();cinematic()};
 $('enter').onclick=go;$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 if(QA){$('nm').value='Sushma';setTimeout(go,300)}}
async function cinematic(){
 roadSpeed=26;driveGrid();rig.pos.set(0,60,80);rig.look.set(0,10,-100);camTo(new THREE.Vector3(0,9,30),new THREE.Vector3(0,6,-120),.6);
 const st=$('story');const lines=[`${player}.`,'Seven letters are hidden in this city.','Find them all.'];
 for(const l of lines){st.innerHTML=`<div>${l}</div>`;await sleep(60);st.firstChild.classList.add('on');await sleep(QA?400:2200);st.firstChild.classList.remove('on');await sleep(QA?200:900)}
 st.innerHTML='';camTo(new THREE.Vector3(0,3,12),new THREE.Vector3(0,1,-10),1.5);await sleep(QA?300:1200);
 $('hud').classList.add('on');$('mute').classList.add('on');setSlots();mi=0;startMission()}

async function finale(){
 cur=null;hint('');stat('');toast('Gone');await sleep(1400);await fadeTo(1,1100);clearStage();$('hud').classList.remove('on');
 music('tsunami',.8);roadSpeed=4;rig.free=false;rig.pos.set(0,6,40);camTo(new THREE.Vector3(0,7,24),new THREE.Vector3(0,14,-200),.4);await fadeTo(0,1500);
 const P=player.toUpperCase();
 panel(`<div class="k">compatibility test</div><div class="vs">KRITESH<i>+</i>${P}</div><div class="meter"><b id="mb"></b></div><div class="pct" id="pc">0%</div>
  <ul class="facts" id="facts">
   <li><span>Compatibility</span><b>off the scale</b></li><li><span>Chemistry</span><b>dangerous</b></li>
   <li><span>Timing</span><b>finally right</b></li><li><span>Verdict</span><b>made for each other</b></li></ul>
  <button class="btn" id="cn" style="opacity:0;pointer-events:none">Continue</button>`);
 const mb=$('mb'),pc=$('pc');
 for(let v=0;v<=100;v+=1){mb.style.width=v+'%';pc.textContent=v+'%';if(v%5==0)sfx.tick();await sleep(v<80?22:45)}
 await sleep(500);for(const v of [127,248,519,999]){pc.textContent=v+'%';flash();sfx.tick();await sleep(260)}
 pc.innerHTML='<span style="font-family:Inter,sans-serif;font-weight:600;font-size:96px">∞</span>';sfx.win();burst(new THREE.Vector3(0,8,10),0xff3fa4,60,10);
 for(const li of $('facts').children){await sleep(650);li.classList.add('on');sfx.tick()}
 await sleep(500);$('cn').style.opacity=1;$('cn').style.pointerEvents='auto';
 if(QA)setTimeout(()=>$('cn').click(),400);
 await waitClick('cn');
 panel(`<div class="k">6 / 7</div><div class="vs" style="font-size:26px;letter-spacing:6px">KRITES<span style="color:var(--cyan);text-shadow:0 0 10px var(--cyan)">_</span></div>
  <p class="line">You found six, ${player}.<br>The last one stays with me.</p>
  <p class="small">That was the deal. You didn't find them all, so when we meet, I tell you what to do.</p>
  <div class="sig">Kritesh</div><button class="btn sm" id="again">Play again</button>`);
 $('again').onclick=()=>location.reload();window.__done=true}

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 sunMat.uniforms.t.value=t;
 roadOff+=roadSpeed*dt;gridMat.uniforms.off.value=-roadOff;
 const rp=rain.geometry.attributes.position.array;for(let i=0;i<RAIN;i++){const o=i*6;rp[o+1]-=dt*22;rp[o+4]-=dt*22;rp[o+2]+=roadSpeed*dt*.3;rp[o+5]+=roadSpeed*dt*.3;
  if(rp[o+1]<0||rp[o+2]>15){const x=rr(-25,25),y=rr(18,30),z=rr(-40,10);rp.set([x,y,z,x+.05,y+.9,z],o)}}rain.geometry.attributes.position.needsUpdate=true;
 if(playing&&cur&&cur.update)cur.update(dt,t);
 for(let k=parts.length-1;k>=0;k--){const p=parts[k],u=p.userData;u.life-=dt*1.5;p.position.addScaledVector(u.v,dt);u.v.y-=4*dt;p.material.opacity=Math.max(0,u.life);p.scale.setScalar(Math.max(.01,u.life));
  if(u.life<=0){scene.remove(p);p.material.dispose();parts.splice(k,1)}}
 if(!rig.free){const k=Math.min(1,dt*rig.k);rig.pos.lerp(rig.tp,k);rig.look.lerp(rig.tl,k);
  shake=Math.max(0,shake-dt);const s=shake*.35;camera.position.set(rig.pos.x+(s?rr(-s,s):0),rig.pos.y+(s?rr(-s,s):0),rig.pos.z);camera.lookAt(rig.look)}
 composer.render()}
requestAnimationFrame(loop);
camera.position.copy(rig.pos);camera.lookAt(rig.look);roadSpeed=8;driveGrid();

new Promise(r=>{new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',f=>{font=f;r()},undefined,()=>r());setTimeout(r,6000)})
 .then(async()=>{$('loading').remove();await fadeTo(0,1200);camTo(new THREE.Vector3(0,5,22),new THREE.Vector3(0,8,-120),.5);intro()});
window.__g={get mi(){return mi},get got(){return got},get done(){return !!window.__done},fin:()=>{if(QA){$('hud').classList.add('on');finale()}}};
</script>
