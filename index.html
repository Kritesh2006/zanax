<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0608">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spell My Name</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#7a1530;--rose:#e7a3ae;--gold:#d8b27a;--cream:#f4e8dc;--muted:#bfa8a8;--glass:rgba(18,8,11,.78);--line:rgba(216,178,122,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0608;font-family:'Inter',system-ui,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:8px;z-index:5}
#hud.on{display:flex}
.slots{display:flex;gap:6px}
.slot{width:34px;height:42px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--cream)}
.slot.on{color:var(--gold);border-bottom-color:var(--gold);text-shadow:0 0 14px rgba(216,178,122,.7);animation:pop .4s}
.slot.cur{border-bottom-color:var(--rose);box-shadow:0 8px 12px -10px var(--rose)}
.row2{display:flex;gap:18px;align-items:center;font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
#lives{font-size:17px;letter-spacing:4px;color:#d23a5a}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:var(--rose);pointer-events:none;padding:0 16px;z-index:5;text-shadow:0 2px 10px rgba(0,0,0,.9);transition:opacity .6s}
#toast{position:fixed;left:0;right:0;top:24%;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:36px;font-weight:600;color:var(--cream);pointer-events:none;opacity:0;z-index:6;padding:0 20px;text-shadow:0 4px 18px rgba(0,0,0,.9)}
#toast.go{animation:toast 1.3s ease-out forwards}
#toast.bad{color:#ff6b7f}
@keyframes toast{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(circle,transparent 40%,rgba(200,20,50,.55))}
#flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);z-index:10;background:rgba(5,2,3,.55)}
.overlay.on{display:flex}
.card{width:100%;max-width:380px;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:30px 22px 24px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;display:flex;flex-direction:column;align-items:center;gap:13px;animation:cardin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.96)}}
.num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
.rule{width:40px;height:1px;background:var(--gold);opacity:.6}
h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:42px;line-height:1.05;margin:0;color:var(--cream)}
.sub{color:var(--muted);font-size:15px;margin:0;line-height:1.55}
.rules{list-style:none;padding:0;margin:2px 0;width:100%;text-align:left}
.rules li{border-top:1px solid var(--line);padding:11px 2px;font-size:14px;display:flex;gap:14px;align-items:baseline;color:var(--muted)}
.rules li i{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:17px;min-width:16px}
.rules b{color:var(--cream);font-weight:600}
.btn{border:1px solid var(--gold);border-radius:2px;padding:14px 36px;font:inherit;font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#0b0608;background:var(--gold);box-shadow:0 10px 30px rgba(216,178,122,.2);cursor:pointer}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:none;font-size:11px;padding:10px 22px}
.tiny{font-size:12px;color:var(--muted);opacity:.8;margin:0;letter-spacing:.5px}
.punish{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 6px;width:100%;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;line-height:1.3;color:var(--cream)}
.punish .tiny{font-family:'Inter',sans-serif;font-style:normal;display:block;margin-top:8px}
.reveal{display:none;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:var(--rose);margin:0;line-height:1.35;animation:pop .4s}
.how{display:flex;gap:10px;width:100%;justify-content:center;font-size:12px;color:var(--muted);letter-spacing:1px}
.how span{border:1px solid var(--line);padding:6px 10px;border-radius:2px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--gold);z-index:20;background:#0b0608}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud">
  <div class="slots" id="slots"></div>
  <div class="row2"><span id="lives"></span><span id="dist">0 m</span></div>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div class="overlay" id="ov"><div class="card" id="card"></div></div>
<div id="loading">loading…</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {FontLoader} from 'three/addons/loaders/FontLoader.js';
import {TextGeometry} from 'three/addons/geometries/TextGeometry.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const FONT_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json';
const NAME='KRITESH';
const DECOYS={K:'CQX',R:'LPA',I:'EYL',T:'DFJ',E:'AIY',S:'ZCX'};
const LINES={K:"K. Easy — you've said it enough times.",R:'R. So you do remember.',I:"I. Okay… you're paying attention.",T:'T. Eyes on me. Good.',E:"E. Careful. I'm getting nervous.",S:'S. One more. Go on — if you can.'};
const WRONG=["That's not me.","Wow. Really?","Forgot me already?","Try again. Properly."];
const OUCH=['Careful.','Focus on me.','Ouch.','Not like that.'];
const DODGE=['Not that easy.','Too slow, love.','You wish.','Almost had me.','Patience.','Not yet.','Getting closer…','Try harder.'];
const QA=new URLSearchParams(location.search).has('qa');

const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- scene ---------- */
const LANE=1.7, LX=[-LANE,0,LANE], SPAWN_Z=-72;
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0608);
scene.fog=new THREE.Fog(0x0b0608,22,78);
const camera=new THREE.PerspectiveCamera(60,1,.1,200);
const cam={x:0,y:3,z:10};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  cam.z=clamp(3.0/(Math.tan(THREE.MathUtils.degToRad(30))*camera.aspect),7,13);cam.y=1.6+cam.z*.17;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffe2d0,0x2a0810,1.0));
const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(2,6,4);scene.add(dl);

const mat=(c,e=.3,m=.35)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,roughness:.3,metalness:m});
const GOLD=mat(0xd8b27a,.45), WINE=mat(0x7a1530,.55), ROSE=mat(0xd23a5a,.6), NEON=new THREE.MeshBasicMaterial({color:0xc0213f});

// floor + lane dashes + side posts
const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,220),new THREE.MeshStandardMaterial({color:0x140609,roughness:.85,metalness:.1}));
floor.rotation.x=-Math.PI/2;floor.position.z=-90;scene.add(floor);
const dashes=[],dashGeo=new THREE.BoxGeometry(.05,.01,2.2),dashMat=new THREE.MeshBasicMaterial({color:0xd8b27a,transparent:true,opacity:.55});
for(const x of [-LANE/2,LANE/2])for(let k=0;k<15;k++){const d=new THREE.Mesh(dashGeo,dashMat);d.position.set(x,.01,6-k*6);scene.add(d);dashes.push(d)}
const posts=[],postGeo=new THREE.BoxGeometry(.08,2.6,.08);
for(const x of [-3.3,3.3])for(let k=0;k<13;k++){const p=new THREE.Mesh(postGeo,NEON);p.position.set(x,1.3,6-k*7);scene.add(p);posts.push(p)}
const edgeGeo=new THREE.BoxGeometry(.04,.02,220);
for(const x of [-2.7,2.7]){const e=new THREE.Mesh(edgeGeo,new THREE.MeshBasicMaterial({color:0xc0213f,transparent:true,opacity:.7}));e.position.set(x,.01,-90);scene.add(e)}
const sp=[];for(let k=0;k<600;k++){const v=new THREE.Vector3(rr(-60,60),rr(4,50),rr(-160,-40));sp.push(v.x,v.y,v.z)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xe9cfa0,size:.25,transparent:true,opacity:.55,fog:false})));
const moon=new THREE.Mesh(new THREE.CircleGeometry(9,48),new THREE.MeshBasicMaterial({color:0x5a0f22,fog:false}));moon.position.set(0,14,-150);scene.add(moon);

// player
const player=new THREE.Group();
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.36,2),mat(0xffe3b0,1.1,.2));player.add(core);
const halo=new THREE.Mesh(new THREE.TorusGeometry(.55,.025,8,48),GOLD);halo.rotation.x=Math.PI/2;player.add(halo);
const plight=new THREE.PointLight(0xffd59a,10,7);plight.position.y=.4;player.add(plight);
player.position.set(0,.5,0);scene.add(player);

// letters
let font=null;const geoCache={};
function letterMesh(ch,material=GOLD,size=.95){
  if(font){if(!geoCache[ch]){const g=new TextGeometry(ch,{font,size,height:size*.32,depth:size*.32,curveSegments:5,bevelEnabled:true,bevelThickness:.05,bevelSize:.035,bevelSegments:2});g.center();geoCache[ch]=g}
    return new THREE.Mesh(geoCache[ch],material)}
  const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');
  x.fillStyle='#d8b27a';x.font='bold 210px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,128,140);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));s.scale.setScalar(size*1.7);return s}
const blockGeo=new RoundedBoxGeometry(1.35,1.1,.55,3,.08);
const ringGeo=new THREE.TorusGeometry(.78,.03,8,40);

/* ---------- fx ---------- */
const parts=[],pGeo=new THREE.SphereGeometry(.07,6,6);
function burst(pos,color=0xd8b27a,n=16,spd=5){for(let k=0;k<n;k++){const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:k%3?color:0xffffff,transparent:true}));
  m.position.copy(pos);m.userData={v:new THREE.Vector3(rr(-1,1),rr(-.2,1.5),rr(-1,1)).normalize().multiplyScalar(rr(2,spd)),life:1,g:6};scene.add(m);parts.push(m)}}
const trailMat=new THREE.MeshBasicMaterial({color:0xffd59a,transparent:true,opacity:.6});
let shake=0,ac=null;
function tone(f1,f2,d,w='sine',v=.14,dl=0){if(!ac)return;const t=ac.currentTime+dl;const o=ac.createOscillator(),g=ac.createGain();o.type=w;
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function sfx(k){if(k==='good')[660,880,1175].forEach((f,i)=>tone(f,f,.16,'triangle',.12,i*.07));else if(k==='bad')tone(300,110,.3,'square',.07);
  else if(k==='hit')tone(160,50,.35,'sawtooth',.09);else if(k==='swipe')tone(500,750,.06,'sine',.04);else if(k==='whoosh')tone(1400,200,.25,'sawtooth',.035)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- ui ---------- */
const slotsEl=$('slots');for(let k=0;k<7;k++){const d=document.createElement('div');d.className='slot';slotsEl.appendChild(d)}
function setSlots(){[...slotsEl.children].forEach((d,k)=>{d.className='slot'+(k<got?' on':'')+(k===got?' cur':'');d.textContent=k<got?NAME[k]:(k===6?'?':'')})}
function setLives(){$('lives').textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(3-Math.max(0,lives))}
function toast(t,bad){const e=$('toast');e.textContent=t;e.classList.toggle('bad',!!bad);e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
function hint(t){$('hint').textContent=t;$('hint').style.opacity=t?1:0}
function flash(){const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function card(html,binds={}){const c=$('card');c.innerHTML=html;c.style.animation='none';void c.offsetWidth;c.style.animation='';$('ov').classList.add('on');
  for(const [id,fn] of Object.entries(binds)){const el=$(id);if(el)el.onclick=fn}}
function hideCard(){$('ov').classList.remove('on')}

/* ---------- game state ---------- */
let mode='menu',paused=false,rows=[],queue=[],since=0,speed=13,gap=11,got=0,lives=3,lane=1,inv=0,hTries=0,dist=0,trailT=0,endT=0;
const speedFor=()=>Math.min(13+got*1.9+hTries*1.2,25);
const gapFor=()=>Math.max(11-got*.5,8);

function clearRows(){for(const r of rows)for(const it of r.items)scene.remove(it.mesh);rows=[]}
function reset(){clearRows();queue=['wait','wait','wait','wait'];since=0;got=0;lives=3;lane=1;inv=0;hTries=0;dist=0;player.position.x=0;
  speed=speedFor();gap=gapFor();setSlots();setLives();segment()}
function segment(){const n=got>=6?4:5+Math.floor(got/2);for(let k=0;k<n;k++)queue.push('obs');queue.push(got>=6?'hgate':'gate')}

function addItem(row,mesh,x,y,extra={}){mesh.position.set(x,y,row.z);scene.add(mesh);row.items.push({mesh,x,...extra})}
function spawn(kind){
  if(kind==='wait')return;
  if((kind==='gate'||kind==='hgate')&&rows.some(r=>r.gate&&!r.done)){queue.unshift(kind);kind='obs'}
  const row={z:SPAWN_Z,items:[],kind,gate:kind!=='obs',done:false};
  if(kind==='obs'){
    const two=Math.random()<.28+got*.07;
    const lanes=shuffle([0,1,2]).slice(0,two?2:1);
    const moving=!two&&got>=2&&Math.random()<.25+got*.06;
    for(const l of lanes){const m=new THREE.Mesh(blockGeo,moving?ROSE:WINE);
      addItem(row,m,LX[l],.6,{kind:'block',vx:moving?(Math.random()<.5?-1:1)*(1.6+got*.3):0})}
  }else if(kind==='gate'){
    const need=NAME[got];const opts=shuffle([need,...shuffle(DECOYS[need].split('')).slice(0,2)]);
    opts.forEach((ch,l)=>{const g=new THREE.Group();g.add(letterMesh(ch));const r=new THREE.Mesh(ringGeo,GOLD);r.position.z=-.25;g.add(r);
      addItem(row,g,LX[l],1,{kind:'letter',ch})});
  }else{
    const g=new THREE.Group();g.add(letterMesh('H',GOLD,1.1));const r=new THREE.Mesh(ringGeo,ROSE);r.scale.setScalar(1.15);r.position.z=-.25;g.add(r);
    const l=Math.floor(Math.random()*3);addItem(row,g,LX[l],1,{kind:'H',dodges:0});
  }
  rows.push(row);
}

function nearX(){return player.position.x}
function hitTest(row){
  const px=nearX();const it=row.items.find(i=>Math.abs(i.x-px)<.9);
  if(row.kind==='obs'){if(it&&inv<=0)ouch(it);return}
  row.done=true;
  if(row.kind==='gate'){
    if(!it)return;
    if(it.ch===NAME[got]){got++;setSlots();sfx('good');buzz(25);burst(it.mesh.position.clone(),0xd8b27a,26,6);scene.remove(it.mesh);
      speed=speedFor();gap=gapFor();toast(LINES[NAME[got-1]]);
      if(got===6)setTimeout(()=>hint('one more letter…'),1400)}
    else{burst(it.mesh.position.clone(),0x6a5a5a,14);scene.remove(it.mesh);toast(pick(WRONG),true);sfx('bad');flash();lose1()}
    if(mode==='play')segment();
  }else{ // H passes by
    hTries++;speed=speedFor();
    const h=row.items[0];h.flyAway=true;sfx('whoosh');
    if(hTries>=3){toast('Not today.');setTimeout(()=>end('h'),1300);mode='ending'}
    else{toast(hTries===1?'Slipped away. Again.':'Closer… once more.');segment()}
  }
}
function ouch(it){sfx('hit');buzz(90);shake=.4;flash();burst(it.mesh.position.clone(),0xd23a5a,18);scene.remove(it.mesh);toast(pick(OUCH),true);lose1()}
function lose1(){lives--;setLives();inv=1.2;if(lives<=0){mode='ending';setTimeout(()=>end('dead'),900)}}

/* ---------- input ---------- */
let sx=0,sy=0,used=false,tracking=false;
function move(d){const n=clamp(lane+d,0,2);if(n!==lane){lane=n;sfx('swipe')}}
const cv=$('c');
cv.addEventListener('pointerdown',e=>{if(mode!=='play')return;tracking=true;used=false;sx=e.clientX;sy=e.clientY});
cv.addEventListener('pointermove',e=>{if(!tracking||used)return;const dx=e.clientX-sx;if(Math.abs(dx)>26){move(dx>0?1:-1);used=true}});
addEventListener('pointerup',e=>{if(!tracking)return;tracking=false;if(used||mode!=='play')return;move(e.clientX<innerWidth/2?-1:1)});
addEventListener('pointercancel',()=>tracking=false);
addEventListener('keydown',e=>{if(mode!=='play')return;if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true}else if(mode==='play'){toast('Ready?');setTimeout(()=>paused=false,1100)}else paused=false});

/* ---------- autopilot (testing only, ?qa) ---------- */
function autopilot(){
  const r=rows.filter(r=>r.z<-.4&&r.z>-20&&!r.done).sort((a,b)=>b.z-a.z)[0];if(!r)return;
  if(r.kind==='gate'){const i=r.items.findIndex(i=>i.ch===NAME[got]);lane=LX.indexOf(r.items[i].x);return}
  if(r.kind==='hgate'){lane=LX.findIndex(x=>Math.abs(x-r.items[0].x)<.1);return}
  const blocked=l=>r.items.some(i=>Math.abs(i.x-LX[l])<1.1);
  if(blocked(lane)){const free=[0,1,2].filter(l=>!blocked(l)).sort((a,b)=>Math.abs(a-lane)-Math.abs(b-lane));if(free.length)lane=free[0]}
}

/* ---------- flow ---------- */
function start(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  hideCard();reset();$('hud').classList.add('on');mode='play';hint('swipe or tap left / right');toast('Ready?');
  setTimeout(()=>{if(mode==='play')hint('pick the right letters. dodge the rest.')},3500);
  setTimeout(()=>{if(mode==='play'&&got<6)hint('')},8000)}
function end(why){mode='end';hint('');
  const h=why==='h';
  card(`<div class="num">${h?'So close':'Out of lives'}</div><h1>Not yet.</h1>
   <p class="sub">${h?'Six letters. The H slipped right through your fingers.':`You got ${got} of 7 letters before you crashed.`}</p>
   <div class="punish">You owe me a dare.<span class="tiny">What is it? Wait for it — the right time will come.</span></div>
   ${h?'<button class="btn ghost" id="rig">Wait… was it rigged?</button><p class="reveal" id="rev">Maybe the H was never meant to be caught.<br>Some things you only get in person.<br>— K</p>':''}
   <button class="btn" id="again">Run it back</button>`,
   {rig:()=>{$('rev').style.display='block';$('rig').style.display='none'},again:start})}
function intro(){
  card(`<div class="num">for you, only</div><h1>Spell my name.</h1><div class="rule"></div>
   <p class="sub">Run the road. Each gate holds three letters — only one is mine. Pick right, in order, and you earn my name.</p>
   <ul class="rules"><li><i>i</i><span>Wrong letter or a crash <b>costs a heart.</b> You have three.</span></li>
   <li><i>ii</i><span>Spell all seven — <b>I sponsor you. Fully. Whenever you want.</b></span></li>
   <li><i>iii</i><span>Fail — <b>you owe me a dare.</b> I choose when.</span></li></ul>
   <div class="how"><span>swipe ←</span><span>tap sides</span><span>swipe →</span></div>
   <button class="btn" id="st">I'm in</button><p class="tiny">sound on · it gets faster</p>`,{st:start})}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  const run=(mode==='play'||mode==='ending')&&!paused;
  const v=run?speed:(mode==='menu'?6:0);
  if(mode==='end')speed*=.97;
  const mv=(mode==='end'?speed:v)*dt;
  if(paused)dt=0;

  for(const d of dashes){d.position.z+=mv;if(d.position.z>6)d.position.z-=90}
  for(const p of posts){p.position.z+=mv;if(p.position.z>8)p.position.z-=91}

  if(run&&mode==='play'){
    if(QA)autopilot();
    dist+=mv;$('dist').textContent=Math.floor(dist)+' m';
    since+=mv;if(since>=gap){since=0;spawn(queue.length?queue.shift():'obs')}
  }
  if(run){
    inv=Math.max(0,inv-dt);
    for(let i=rows.length-1;i>=0;i--){const r=rows[i];const pz=r.z;r.z+=mv;
      for(const it of r.items){
        if(it.vx){it.x+=it.vx*dt;if(it.x>LANE){it.x=LANE;it.vx*=-1}if(it.x<-LANE){it.x=-LANE;it.vx*=-1}}
        if(it.kind==='H'&&!r.done&&r.z>-17){ // the rigged part: H never lets you reach it
          const tx=LX[lane];if(Math.abs(it.x-tx)<.9||Math.abs(it.x-player.position.x)<.9){
            const opts=[0,1,2].filter(l=>Math.abs(LX[l]-tx)>.9&&Math.abs(LX[l]-player.position.x)>.9);
            it.x=LX[pick(opts.length?opts:[0,2].filter(l=>l!==lane))];it.dodges++;sfx('whoosh');burst(it.mesh.position.clone(),0xd8b27a,8,3);
            if(it.dodges<=6||Math.random()<.4)toast(DODGE[(it.dodges-1)%DODGE.length])}}
        if(it.flyAway){it.mesh.position.y+=dt*9;it.mesh.rotation.y+=dt*8}
        it.mesh.position.x+=(it.x-it.mesh.position.x)*Math.min(1,dt*(it.kind==='H'?22:30));
        it.mesh.position.z=r.z;
        if(it.kind==='letter'||it.kind==='H'){it.mesh.rotation.y=Math.sin(t*2+it.x)*.35;if(!it.flyAway)it.mesh.position.y=1+Math.sin(t*3+it.x)*.08}
      }
      if(pz<0&&r.z>=0&&mode==='play')hitTest(r);
      if(r.z>cam.z+2){for(const it of r.items)scene.remove(it.mesh);rows.splice(i,1)}
    }
  }else if(mode==='menu'){player.position.x=Math.sin(t*.8)*1.2}

  // player
  if(mode!=='menu')player.position.x+=(LX[lane]-player.position.x)*Math.min(1,dt*16);
  core.rotation.x+=dt*3;core.rotation.y+=dt*2;halo.rotation.z+=dt*1.5;
  player.position.y=.5+Math.sin(t*5)*.05;
  player.visible=inv<=0||Math.floor(t*14)%2===0;
  trailT-=dt;if(trailT<=0&&(run||mode==='menu')){trailT=.03;const m=new THREE.Mesh(pGeo,trailMat.clone());m.position.copy(player.position);m.position.y-=.05;
    m.userData={v:new THREE.Vector3(rr(-.2,.2),rr(0,.3),Math.max(v,6)),life:.7,g:0};scene.add(m);parts.push(m)}

  for(let k=parts.length-1;k>=0;k--){const p=parts[k],u=p.userData;u.life-=(dt||.016)*1.6;p.position.addScaledVector(u.v,dt||.016);u.v.y-=u.g*(dt||.016);
    p.material.opacity=Math.max(0,u.life);p.scale.setScalar(Math.max(.01,u.life));if(u.life<=0){scene.remove(p);p.material.dispose();parts.splice(k,1)}}

  shake=Math.max(0,shake-(dt||.016));const s=shake*.35;
  camera.position.set(cam.x+player.position.x*.25+(s?rr(-s,s):0),cam.y+(s?rr(-s,s):0),cam.z);camera.lookAt(player.position.x*.2,.6,-8);
  renderer.render(scene,camera)}
requestAnimationFrame(loop);

new Promise(r=>{new FontLoader().load(FONT_URL,f=>{font=f;r()},undefined,()=>r());setTimeout(r,5000)})
  .then(()=>{$('loading').remove();intro()});
window.__game={get mode(){return mode},get got(){return got},get lives(){return lives},get hTries(){return hTries}};
